<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>今日の禅語</title>
<script src="https://cdn.jsdelivr.net/npm/suncalc@1.9.0/suncalc.js"></script>
<style>
:root{--bg:#f5efe4;--paper:#fffdf8;--ink:#211f1b;--muted:#746d62;--line:#d9cdb9;--green:#385343;--accent:#8a5b32;--shadow:0 18px 50px rgba(50,38,20,.10)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Yu Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;background:linear-gradient(135deg,#f8f4ec,#ede0cb)}
.wrap{max-width:940px;margin:auto;padding:24px 18px 44px}.top{display:flex;justify-content:flex-end;margin-bottom:18px}.actions{display:flex;gap:8px;flex-wrap:wrap}
button{border:1px solid var(--line);background:rgba(255,253,248,.86);border-radius:999px;padding:9px 13px;color:var(--ink);font:14px system-ui,sans-serif;box-shadow:0 5px 16px rgba(50,38,20,.05);cursor:pointer}
.card{background:rgba(255,253,248,.94);border:1px solid var(--line);border-radius:28px;padding:34px 38px;box-shadow:var(--shadow)}
.brand{display:flex;gap:12px;align-items:center}.enso{width:42px;height:42px;border:4px solid var(--ink);border-right-color:transparent;border-radius:50%;transform:rotate(-25deg)}
h1{font-size:36px;font-weight:500;letter-spacing:.08em;margin:0}.sub{font:13px system-ui,sans-serif;color:var(--muted);letter-spacing:.1em;margin:5px 0 0}
.datetime{text-align:center;color:var(--muted);font:14px system-ui,sans-serif;margin:25px 0 12px}.calendar{display:flex;justify-content:center;gap:9px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:999px;padding:8px 14px;color:var(--green);font-size:15px;background:#fff}
.word{text-align:center;font-size:clamp(42px,8.5vw,86px);letter-spacing:.08em;line-height:1.25;margin:38px auto 13px;overflow-wrap:anywhere}.reading{text-align:center;color:var(--accent);font-size:17px;letter-spacing:.12em;line-height:1.8;margin-bottom:34px}
.section{border-top:1px solid var(--line);padding-top:22px;margin-top:18px}.label{font:12px system-ui,sans-serif;color:var(--green);letter-spacing:.18em;margin-bottom:10px}.text{font-size:19px;line-height:1.95;margin:0}
.weather{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:30px}.mini{text-align:center;border:1px solid var(--line);border-radius:17px;padding:13px;background:#fff}.mini span{display:block;font:11px system-ui,sans-serif;color:var(--muted);margin-bottom:5px}.mini b{font:700 17px system-ui,sans-serif}
.controls{margin-top:16px}select{width:100%;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fffdf8;font-family:inherit;font-size:15px}footer{text-align:center;font:12px system-ui,sans-serif;color:var(--muted);margin-top:16px}
@media(max-width:700px){.card{padding:24px 20px}.word{font-size:clamp(36px,11vw,62px)}.reading{font-size:15px}.text{font-size:17px}.weather{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="actions"><button id="todayBtn">今日</button><button id="randomBtn">ランダム</button><button id="copyBtn">コピー</button></div></div>
  <main class="card">
    <div class="brand"><div class="enso"></div><div><h1>今日の禅語</h1><p class="sub">A Zen word for each day</p></div></div>
    <div class="datetime" id="datetime"></div>
    <div class="calendar"><div class="chip" id="sekki"></div><div class="chip" id="moon"></div></div>
    <div class="word" id="word"></div>
    <div class="reading" id="reading"></div>
    <div class="section"><div class="label">意味</div><p class="text" id="meaning"></p></div>
    <div class="weather">
      <div class="mini"><span>天気</span><b id="weather">--</b></div>
      <div class="mini"><span>現在</span><b id="temp">--℃</b></div>
      <div class="mini"><span>最高 / 最低</span><b id="maxmin">-- / --℃</b></div>
      <div class="mini"><span>気圧</span><b id="pressure">--</b></div>
    </div>
  </main>
  <div class="controls"><select id="dateSelect"></select></div>
  <footer>東京固定。選択した日付に合わせて、二十四節気と月相を表示します。</footer>
</div>
<script>
let allData=[],current=null,currentDate=null;
const $=id=>document.getElementById(id),pad=n=>String(n).padStart(2,"0"),keyFor=d=>`${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
async function loadData(){
 const files=Array.from({length:12},(_,i)=>`data/${pad(i+1)}.json`);
 const months=await Promise.all(files.map(async f=>{const r=await fetch(f);if(!r.ok)throw new Error(`${f}を読み込めません`);return r.json()}));
 allData=months.flat();
 $("dateSelect").innerHTML=allData.map((z,i)=>`<option value="${i}">${z.date}｜${z.word}</option>`).join("");
 renderToday();
}
function solarLongitude(d){const jd=d.getTime()/86400000+2440587.5,T=(jd-2451545)/36525,L0=(280.46646+36000.76983*T+0.0003032*T*T)%360,M=(357.52911+35999.05029*T-0.0001537*T*T)*Math.PI/180,C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);return(L0+C+360)%360}
const solarTerms=[["春分",0],["清明",15],["穀雨",30],["立夏",45],["小満",60],["芒種",75],["夏至",90],["小暑",105],["大暑",120],["立秋",135],["処暑",150],["白露",165],["秋分",180],["寒露",195],["霜降",210],["立冬",225],["小雪",240],["大雪",255],["冬至",270],["小寒",285],["大寒",300],["立春",315],["雨水",330],["啓蟄",345]];
function sekkiName(d){const lon=solarLongitude(d);for(let i=solarTerms.length-1;i>=0;i--)if(lon>=solarTerms[i][1])return solarTerms[i][0];return"啓蟄"}
function moonName(d){try{const p=SunCalc.getMoonIllumination(d).phase;if(p<.03||p>.97)return"新月";if(p<.22)return"三日月";if(p<.28)return"上弦の月";if(p<.47)return"満ちていく月";if(p<.53)return"満月";if(p<.72)return"欠けていく月";if(p<.78)return"下弦の月";return"明け方の月"}catch(e){return"月相取得不可"}}
function dateForEntry(z,year=new Date().getFullYear()){const [m,d]=z.date.split('-').map(Number);return new Date(year,m-1,d,12,0,0)}
function showDate(d){const w=["日","月","火","水","木","金","土"];$('datetime').textContent=`${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日（${w[d.getDay()]}）`;$('sekki').textContent=`二十四節気：${sekkiName(d)}`;$('moon').textContent=`月相：${moonName(d)}`}
function render(z,d=dateForEntry(z)){current=z;currentDate=d;$('word').textContent=z.word;$('reading').textContent=z.reading;$('meaning').textContent=z.meaning;$('dateSelect').value=allData.indexOf(z);showDate(d);document.title=`${z.word}｜今日の禅語`}
function renderToday(){const now=new Date(),z=allData.find(x=>x.date===keyFor(now))||allData[0];render(z,now)}
function weatherName(c){if(c===0)return"快晴";if([1,2].includes(c))return"晴れ時々曇り";if(c===3)return"曇り";if([45,48].includes(c))return"霧";if([51,53,55,61,63,65,80,81,82].includes(c))return"雨";if([71,73,75,85,86].includes(c))return"雪";if([95,96,99].includes(c))return"雷雨";return"天気"}
function pressureState(p){if(p<990)return"超警戒";if(p<1000)return"警戒";if(p<1008)return"注意";return"普通"}
async function loadWeather(){try{const u="https://api.open-meteo.com/v1/forecast?latitude=35.6762&longitude=139.6503&current=temperature_2m,weather_code,surface_pressure&daily=temperature_2m_max,temperature_2m_min&timezone=Asia%2FTokyo&forecast_days=1";const d=await fetch(u).then(r=>r.json()),t=Math.round(d.current.temperature_2m),p=Math.round(d.current.surface_pressure),mx=Math.round(d.daily.temperature_2m_max[0]),mn=Math.round(d.daily.temperature_2m_min[0]);$('weather').textContent=weatherName(d.current.weather_code);$('temp').textContent=`${t}℃`;$('maxmin').textContent=`${mx} / ${mn}℃`;$('pressure').textContent=pressureState(p)}catch(e){$('weather').textContent="取得不可"}}
$('todayBtn').onclick=renderToday;
$('randomBtn').onclick=()=>{const z=allData[Math.floor(Math.random()*allData.length)];render(z,dateForEntry(z))};
$('dateSelect').onchange=e=>{const z=allData[Number(e.target.value)];render(z,dateForEntry(z))};
$('copyBtn').onclick=async()=>{if(!current)return;await navigator.clipboard.writeText(`今日の禅語：${current.word}
読み：${current.reading}
意味：${current.meaning}`)};
loadData().catch(e=>{$('meaning').textContent='データの読み込みに失敗しました。ローカルではWebサーバー経由で開いてください。'});loadWeather();setInterval(loadWeather,1800000);
</script>
</body></html>
