<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>今日の禅語</title><style>
:root{--ink:#25231f;--muted:#777167;--line:#d9d4ca;--paper:#f7f4ed;--accent:#2f5d50}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Yu Mincho","Hiragino Mincho ProN",serif;min-height:100vh}.wrap{max-width:860px;margin:auto;padding:40px 24px 70px}header{text-align:center;border-bottom:1px solid var(--line);padding-bottom:22px}.eyebrow{letter-spacing:.22em;font-size:13px;color:var(--muted)}h1{font-weight:500;letter-spacing:.16em;margin:10px 0 8px;font-size:25px}.date{color:var(--muted);font-size:15px}.card{text-align:center;padding:70px 12px 50px}.word{font-size:clamp(34px,7vw,64px);letter-spacing:.12em;line-height:1.45;font-weight:500}.reading{margin-top:20px;font-size:clamp(16px,2.6vw,22px);letter-spacing:.14em;color:var(--accent);min-height:1.8em}.divider{width:80px;height:1px;background:var(--line);margin:38px auto}.meaning-block{max-width:680px;margin:auto;text-align:left}.meaning-title{font-size:15px;letter-spacing:.2em;color:var(--muted);margin-bottom:15px}.meaning{font-size:18px;line-height:2;letter-spacing:.035em}.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:45px}button{font:inherit;border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 20px;border-radius:999px;cursor:pointer}button:hover{background:#eee9df}.meta{text-align:center;color:var(--muted);font-size:13px;margin-top:28px}.notice{max-width:680px;margin:20px auto 0;color:#8b5b3e;font-size:13px;line-height:1.7;text-align:center}@media(max-width:600px){.wrap{padding-top:28px}.card{padding-top:48px}.meaning{font-size:16px}}
</style></head><body><div class="wrap"><header><div class="eyebrow">ZEN WORD OF THE DAY</div><h1>今日の禅語</h1><div class="date" id="date"></div></header><main class="card"><div class="word" id="word">読み込み中</div><div class="reading" id="reading"></div><div class="divider"></div><section class="meaning-block"><div class="meaning-title">意味</div><div class="meaning" id="meaning"></div></section><div class="controls"><button id="today">今日</button><button id="random">ランダム</button><button id="copy">コピー</button></div><div class="meta" id="meta"></div><div class="notice" id="notice"></div></main></div><script>
let data = [];
let current = null;
const jp = new Intl.DateTimeFormat('ja-JP', {
  year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
});

async function load() {
  const response = await fetch('data/all.json');
  if (!response.ok) throw new Error(`HTTP ${response.status}`);
  data = await response.json();
  showToday();
}

function render(item, dateObj) {
  current = item;
  document.getElementById('word').textContent = item.word;
  document.getElementById('reading').textContent = item.reading;
  document.getElementById('meaning').textContent = item.meaning;
  document.getElementById('date').textContent = jp.format(dateObj);
  document.getElementById('meta').textContent = item.date;
  document.getElementById('notice').textContent = '';
}

function showToday() {
  const now = new Date();
  const key = `${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  const item = data.find(x => x.date === key);
  if (item) render(item, now);
}

document.getElementById('today').onclick = showToday;
document.getElementById('random').onclick = () => {
  const item = data[Math.floor(Math.random() * data.length)];
  const [month, day] = item.date.split('-').map(Number);
  render(item, new Date(new Date().getFullYear(), month - 1, day));
};
document.getElementById('copy').onclick = async () => {
  if (!current) return;
  await navigator.clipboard.writeText(`${current.word}
${current.reading}

${current.meaning}`);
  const button = document.getElementById('copy');
  button.textContent = 'コピー済み';
  setTimeout(() => button.textContent = 'コピー', 1200);
};

load().catch(() => {
  document.getElementById('word').textContent = 'データを読み込めません';
  document.getElementById('reading').textContent = '';
  document.getElementById('meaning').textContent = 'GitHub PagesなどのWebサーバー上で表示してください。';
});
</script></body></html>
